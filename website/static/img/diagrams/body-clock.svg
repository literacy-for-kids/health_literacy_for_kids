<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bclTitle">
  <title id="bclTitle">The 24-hour body clock as a circle: morning wake-up and rising energy, midday alertness, afternoon dip, evening wind-down, and nighttime sleep, cleanup, and repair</title>
  <rect x="1" y="1" width="758" height="558" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="380" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Your 24-Hour Body Clock</text>

  <!-- day/night halves -->
  <g transform="translate(380 310)">
    <path d="M0,-190 A190,190 0 0 1 0,190 Z" fill="#fef9c3"/>
    <path d="M0,190 A190,190 0 0 1 0,-190 Z" fill="#e0e7ff"/>
    <circle r="190" fill="none" stroke="#0e7490" stroke-width="4"/>
    <circle r="95" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <!-- sun and moon -->
    <circle cx="130" cy="-8" r="20" fill="#fde047"/>
    <path d="M-138,-18 a20,20 0 1 0 16,32 a15,15 0 1 1 -16,-32" fill="#94a3b8"/>
    <!-- labels around -->
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" text-anchor="middle" fill="#1e293b">
      <text y="-158" font-weight="700">morning</text>
      <text y="-140" font-size="12" fill="#64748b">wake up &#183; energy rises</text>
      <text x="132" y="-62" font-weight="700">midday</text>
      <text x="132" y="-44" font-size="12" fill="#64748b">most alert</text>
      <text x="118" y="92" font-weight="700">afternoon</text>
      <text x="118" y="110" font-size="12" fill="#64748b">a natural little dip</text>
      <text y="152" font-weight="700">evening</text>
      <text y="170" font-size="12" fill="#64748b">wind-down &#183; sleepy signals</text>
      <text x="-124" y="80" font-weight="700">night</text>
      <text x="-124" y="98" font-size="12" fill="#64748b">deep sleep &#183; repair</text>
      <text x="-128" y="-56" font-weight="700">late night</text>
      <text x="-128" y="-38" font-size="12" fill="#64748b">cleanup crew works</text>
    </g>
    <!-- center -->
    <text y="-8" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#0e7490">the body clock</text>
    <text y="14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#64748b">toolbox word:</text>
    <text y="30" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#64748b">circadian rhythm</text>
  </g>

  <text x="380" y="540" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">Light is the clock&#8217;s biggest hint: bright mornings and dim evenings help it stay on time.</text>
</svg>
