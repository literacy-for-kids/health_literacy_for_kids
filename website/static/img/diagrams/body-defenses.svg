<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bdeTitle">
  <title id="bdeTitle">The body's defense layers shown as a castle: the wall is skin, the sticky moat is mucus, the guards are white blood cells, wanted posters are antibodies, and the memory book remembers germs the body has beaten before</title>
  <rect x="1" y="1" width="858" height="478" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">The Body Castle</text>
  <text x="430" y="64" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">Five layers of protection, from the outside in.</text>

  <!-- castle scene -->
  <g transform="translate(0 16)">
    <!-- moat -->
    <ellipse cx="380" cy="330" rx="290" ry="88" fill="#a5f3fc"/>
    <!-- wall -->
    <rect x="200" y="180" width="360" height="150" rx="8" fill="#94a3b8"/>
    <g fill="#94a3b8">
      <rect x="200" y="162" width="34" height="26"/><rect x="266" y="162" width="34" height="26"/><rect x="332" y="162" width="34" height="26"/><rect x="398" y="162" width="34" height="26"/><rect x="464" y="162" width="34" height="26"/><rect x="526" y="162" width="34" height="26"/>
    </g>
    <!-- keep -->
    <rect x="320" y="96" width="120" height="100" fill="#64748b"/>
    <polygon points="310,96 380,58 450,96" fill="#475569"/>
    <!-- gate -->
    <path d="M355,330 L355,262 A25,25 0 0 1 405,262 L405,330 Z" fill="#334155"/>
    <!-- guards -->
    <g fill="#0e7490">
      <circle cx="255" cy="252" r="12"/><rect x="247" y="264" width="16" height="26" rx="6"/>
      <circle cx="505" cy="252" r="12"/><rect x="497" y="264" width="16" height="26" rx="6"/>
    </g>
    <!-- wanted poster -->
    <rect x="430" y="240" width="46" height="58" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <circle cx="453" cy="262" r="9" fill="#a16207"/>
    <rect x="438" y="278" width="30" height="4" fill="#a16207"/>
    <rect x="438" y="286" width="22" height="4" fill="#a16207"/>
    <!-- memory book -->
    <g transform="translate(305 268)">
      <rect x="-24" y="-16" width="48" height="34" rx="4" fill="#7c3aed"/>
      <line x1="0" y1="-16" x2="0" y2="18" stroke="#ede9fe" stroke-width="3"/>
    </g>
  </g>

  <!-- labels -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5">
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="560" y1="210" x2="640" y2="180"/>
      <line x1="620" y1="345" x2="688" y2="330"/>
      <line x1="512" y1="270" x2="640" y2="262"/>
      <line x1="476" y1="262" x2="640" y2="230"/>
      <line x1="330" y1="285" x2="230" y2="390"/>
    </g>
    <g fill="#1e293b">
      <text x="648" y="178" font-weight="700">the wall = skin</text>
      <text x="648" y="196" font-size="12" fill="#64748b">keeps most germs out</text>
      <text x="696" y="330" font-weight="700">sticky moat = mucus</text>
      <text x="696" y="348" font-size="12" fill="#64748b">traps what sneaks close</text>
      <text x="648" y="264" font-weight="700">guards = white blood cells</text>
      <text x="648" y="282" font-size="12" fill="#64748b">patrol and fight invaders</text>
      <text x="648" y="228" font-weight="700">wanted posters = antibodies</text>
      <text x="648" y="246" font-size="12" fill="#64748b">mark germs so guards spot them fast</text>
      <text x="150" y="410" font-weight="700">memory book = immune memory</text>
      <text x="150" y="428" font-size="12" fill="#64748b">remembers germs the body beat before</text>
    </g>
  </g>

  <text x="430" y="462" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b">Layers work together: most germs never get past the wall and the moat.</text>
</svg>
