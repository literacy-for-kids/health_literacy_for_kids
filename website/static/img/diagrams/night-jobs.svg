<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="njTitle">
  <title id="njTitle">Three night jobs while you sleep: the cleanup crew tidies the brain, the repair crew fixes and grows the body, and the memory librarian sorts what to keep from the day</title>
  <rect x="1" y="1" width="858" height="378" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="42" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Three Jobs Your Body Does at Night</text>

  <g font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <!-- cleanup -->
    <g>
      <rect x="55" y="80" width="230" height="230" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2.5"/>
      <!-- broom -->
      <g transform="translate(170 155) rotate(20)">
        <line x1="0" y1="-42" x2="0" y2="26" stroke="#a16207" stroke-width="6" stroke-linecap="round"/>
        <polygon points="-18,26 18,26 26,58 -26,58" fill="#fbbf24"/>
      </g>
      <text x="170" y="248" font-size="15.5" font-weight="800" fill="#0e7490">CLEANUP CREW</text>
      <text x="170" y="274" font-size="12.5" fill="#1e293b">sweeps out the brain&#8217;s</text>
      <text x="170" y="291" font-size="12.5" fill="#1e293b">daily leftovers</text>
    </g>
    <!-- repair -->
    <g>
      <rect x="315" y="80" width="230" height="230" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2.5"/>
      <!-- wrench -->
      <g transform="translate(430 150) rotate(-35)" fill="#64748b">
        <path d="M-8,-50 a20,20 0 1 0 16,0 l0,14 -16,0 z"/>
        <rect x="-7" y="-38" width="14" height="80" rx="7"/>
        <path d="M-8,56 a20,20 0 1 1 16,0 l0,-14 -16,0 z" transform="translate(0 -14)"/>
      </g>
      <text x="430" y="248" font-size="15.5" font-weight="800" fill="#0e7490">REPAIR CREW</text>
      <text x="430" y="274" font-size="12.5" fill="#1e293b">fixes muscles and helps</text>
      <text x="430" y="291" font-size="12.5" fill="#1e293b">the body grow</text>
    </g>
    <!-- librarian -->
    <g>
      <rect x="575" y="80" width="230" height="230" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2.5"/>
      <!-- books -->
      <g transform="translate(690 158)">
        <rect x="-52" y="-10" width="22" height="52" rx="3" fill="#7c3aed"/>
        <rect x="-24" y="-22" width="22" height="64" rx="3" fill="#0ea5e9"/>
        <rect x="4" y="-4" width="22" height="46" rx="3" fill="#16a34a"/>
        <rect x="30" y="-30" width="22" height="72" rx="3" fill="#f59e0b" transform="rotate(12 41 6)"/>
      </g>
      <text x="690" y="248" font-size="15.5" font-weight="800" fill="#0e7490">MEMORY LIBRARIAN</text>
      <text x="690" y="274" font-size="12.5" fill="#1e293b">sorts the day and shelves</text>
      <text x="690" y="291" font-size="12.5" fill="#1e293b">what&#8217;s worth keeping</text>
    </g>
  </g>

  <text x="430" y="350" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#64748b">Skip sleep and the crews get less shift time &#8212; that is why everything feels harder on a tired day.</text>
</svg>
