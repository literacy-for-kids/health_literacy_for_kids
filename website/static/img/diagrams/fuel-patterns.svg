<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" role="img" aria-labelledby="title desc">
<title id="title">Fictional glucose model patterns</title>
<desc id="desc">Invented values only. The x axis is minutes after model input; the y axis is arbitrary model glucose units, not mg/dL or energy feelings. A values: 40,75,65,50,44. B values: 40,55,62,54,46 at 0,30,60,90,120 minutes.</desc>
<rect width="860" height="490" rx="16" fill="#fff" stroke="#cbd5e1"/>
<g font-family="system-ui, sans-serif" fill="#1e293b">
<text x="430" y="35" text-anchor="middle" font-size="22" font-weight="700">Two glucose model patterns</text>
<text x="430" y="59" text-anchor="middle" font-size="14">Invented teaching data — not measurements or medical targets</text>
<text transform="translate(28,230) rotate(-90)" text-anchor="middle" font-size="14">Glucose (arbitrary model units)</text>
<line x1="105" y1="360.0" x2="765" y2="360.0" stroke="#e2e8f0"/><text x="88" y="365.0" text-anchor="end" font-size="13">0</text>
<line x1="105" y1="308.0" x2="765" y2="308.0" stroke="#e2e8f0"/><text x="88" y="313.0" text-anchor="end" font-size="13">20</text>
<line x1="105" y1="256.0" x2="765" y2="256.0" stroke="#e2e8f0"/><text x="88" y="261.0" text-anchor="end" font-size="13">40</text>
<line x1="105" y1="204.0" x2="765" y2="204.0" stroke="#e2e8f0"/><text x="88" y="209.0" text-anchor="end" font-size="13">60</text>
<line x1="105" y1="152.0" x2="765" y2="152.0" stroke="#e2e8f0"/><text x="88" y="157.0" text-anchor="end" font-size="13">80</text>
<line x1="105" y1="100.0" x2="765" y2="100.0" stroke="#e2e8f0"/><text x="88" y="105.0" text-anchor="end" font-size="13">100</text>
<line x1="105" y1="100" x2="105" y2="360" stroke="#e2e8f0"/><text x="105" y="383" text-anchor="middle" font-size="13">0</text>
<line x1="270" y1="100" x2="270" y2="360" stroke="#e2e8f0"/><text x="270" y="383" text-anchor="middle" font-size="13">30</text>
<line x1="435" y1="100" x2="435" y2="360" stroke="#e2e8f0"/><text x="435" y="383" text-anchor="middle" font-size="13">60</text>
<line x1="600" y1="100" x2="600" y2="360" stroke="#e2e8f0"/><text x="600" y="383" text-anchor="middle" font-size="13">90</text>
<line x1="765" y1="100" x2="765" y2="360" stroke="#e2e8f0"/><text x="765" y="383" text-anchor="middle" font-size="13">120</text>
<path d="M105 100 V360 H765" fill="none" stroke="#475569" stroke-width="2"/>
<text x="435" y="411" text-anchor="middle" font-size="14">Time after model input (minutes)</text>
<polyline points="105,256.0 270,165.0 435,191.0 600,230.0 765,245.6" fill="none" stroke="#c2410c" stroke-width="3" />
<circle cx="105" cy="256.0" r="4" fill="#c2410c"/>
<circle cx="270" cy="165.0" r="4" fill="#c2410c"/>
<circle cx="435" cy="191.0" r="4" fill="#c2410c"/>
<circle cx="600" cy="230.0" r="4" fill="#c2410c"/>
<circle cx="765" cy="245.6" r="4" fill="#c2410c"/>
<polyline points="105,256.0 270,217.0 435,198.79999999999998 600,219.6 765,240.39999999999998" fill="none" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 5"/>
<circle cx="105" cy="256.0" r="4" fill="#0369a1"/>
<circle cx="270" cy="217.0" r="4" fill="#0369a1"/>
<circle cx="435" cy="198.79999999999998" r="4" fill="#0369a1"/>
<circle cx="600" cy="219.6" r="4" fill="#0369a1"/>
<circle cx="765" cy="240.39999999999998" r="4" fill="#0369a1"/>
<line x1="160" y1="445" x2="207" y2="445" stroke="#c2410c" stroke-width="3"/><text x="216" y="450" font-size="14">Pattern A (solid)</text>
<line x1="455" y1="445" x2="502" y2="445" stroke="#0369a1" stroke-width="3" stroke-dasharray="9 5"/><text x="511" y="450" font-size="14">Pattern B (dashed)</text>
<text x="430" y="477" text-anchor="middle" font-size="13">Neither curve measures a feeling or identifies a breakfast.</text>
</g></svg>