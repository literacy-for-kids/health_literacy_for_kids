<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Health Systems Literacy for Kids Logo</title>
  <desc id="desc">A compact teal health systems literacy icon showing a stethoscope and heartbeat line, designed to be readable at small sizes.</desc>

  <!-- Background badge -->
  <rect x="12" y="12" width="176" height="176" rx="42" fill="#ECFEFF"/>
  <rect x="12" y="12" width="176" height="176" rx="42" stroke="#0E7490" stroke-width="8"/>

  <!-- Stethoscope tubing -->
  <path d="M67 56
           V89
           C67 111 82 126 100 126
           C118 126 133 111 133 89
           V56"
        stroke="#0E7490" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Earpiece tips -->
  <circle cx="67" cy="52" r="10" fill="#0E7490"/>
  <circle cx="133" cy="52" r="10" fill="#0E7490"/>
  <circle cx="67" cy="52" r="4" fill="#A5F3FC"/>
  <circle cx="133" cy="52" r="4" fill="#A5F3FC"/>

  <!-- Neck connector -->
  <path d="M100 126V146" stroke="#0E7490" stroke-width="10" stroke-linecap="round"/>

  <!-- Diaphragm -->
  <circle cx="100" cy="157" r="22" fill="#A5F3FC" stroke="#0E7490" stroke-width="8"/>
  <circle cx="100" cy="157" r="8" fill="#0E7490"/>

  <!-- Heartbeat line across center -->
  <path d="M45 105
           H70
           L80 88
           L94 119
           L106 96
           L117 105
           H155"
        stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 105
           H70
           L80 88
           L94 119
           L106 96
           L117 105
           H155"
        stroke="#0E7490" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small system/measurement nodes -->
  <circle cx="45" cy="105" r="6" fill="#A5F3FC" stroke="#0E7490" stroke-width="4"/>
  <circle cx="155" cy="105" r="6" fill="#A5F3FC" stroke="#0E7490" stroke-width="4"/>
  <circle cx="80" cy="88" r="5" fill="#FFFFFF" stroke="#0E7490" stroke-width="4"/>
  <circle cx="94" cy="119" r="5" fill="#FFFFFF" stroke="#0E7490" stroke-width="4"/>
  <circle cx="106" cy="96" r="5" fill="#FFFFFF" stroke="#0E7490" stroke-width="4"/>

  <!-- Calm health accents -->
  <circle cx="47" cy="54" r="6" fill="#67E8F9"/>
  <circle cx="153" cy="54" r="6" fill="#67E8F9"/>
  <circle cx="45" cy="147" r="6" fill="#67E8F9"/>
  <circle cx="155" cy="147" r="6" fill="#67E8F9"/>
</svg>
